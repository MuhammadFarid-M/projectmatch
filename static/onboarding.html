<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your profile · ProjectMatch</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap narrow">
  <h1>Set up your profile</h1>
  <p class="sub">Everything here feeds the matching engine. Skip a section and
    you simply stop appearing in the lists that section would have placed you in.</p>

  <form method="POST" action="/profile" id="form">
    <input type="hidden" name="onboarding" value="1">
  </form>
</div>

<script src="/app.js"></script>
<script>
let V = null, projCount = 0;

function projectBlock(p) {
  const i = projCount++;
  return `
    <div class="slot-block">
      <label>Project title</label>
      <input type="text" name="project_title"
        value="${esc(p?.title || '')}"
        placeholder="SOC alert triage dashboard">

      <div class="row">
        <div>
          <label>How far did it get?</label>
          <select name="project_outcome">
            ${V.outcomes.map(o => `<option value="${esc(o)}" ${p?.outcome === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>How long did it run?</label>
          <select name="project_duration">
            ${V.durations.map(d => `<option value="${esc(d)}" ${p?.duration === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}
          </select>
        </div>
      </div>

      <label>Link to the repo or a live version</label>
      <input type="text" name="project_link" value="${esc(p?.link || '')}"
        placeholder="https://github.com/…">

      <label>Skills you used on it</label>
      ${picker('project_skills_' + i, V.skills, p?.skills || [])}

      <label>Domain it was in</label>
      ${picker('project_domains_' + i, V.domains, p?.domains || [])}

      <button type="button" class="linkish"
        onclick="this.closest('.slot-block').remove()">remove this project</button>
    </div>`;
}

function addProject(p) {
  document.getElementById('projects')
    .insertAdjacentHTML('beforeend', projectBlock(p));
}

(async () => {
  const me = await injectNav();
  if (!me) { location.href = '/auth.html'; return; }
  V = await api('/api/vocab');

  document.getElementById('form').insertAdjacentHTML('beforeend', `
    <h2>Who you are</h2>
    <label>Name</label>
    <input type="text" name="name" value="${esc(me.name)}" required>

    <label>A couple of lines about yourself</label>
    <textarea name="bio" placeholder="What you build, and what kind of team you're looking for.">${esc(me.bio)}</textarea>

    <div class="row">
      <div>
        <label>Primary role</label>
        <select name="role" required>
          ${V.roles.map(r => `<option ${r === me.role ? 'selected' : ''}>${esc(r)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Experience level</label>
        <select name="experience_level">
          ${V.levels.map(l => `<option ${l === me.experience_level ? 'selected' : ''}>${esc(l)}</option>`).join('')}
        </select>
      </div>
    </div>

    <h2>Skills</h2>
    <p class="sub">The single biggest input. Teams are matched to you on the
      skills they're missing, so under-listing costs you matches.</p>
    ${picker('skills', V.skills, me.skills)}

    <h2>Interests</h2>
    <p class="sub">The problems you actually want to work on. This is what
      stops you being matched to a team you'd be bored by.</p>
    ${picker('interests', V.domains, me.interests)}

    <h2>Availability</h2>
    <p class="sub">Teams with events outside your window won't see you at all —
      this is a hard filter, not a score.</p>
    <div class="row">
      <div><label>Available from</label>
        <input type="date" name="available_from" value="${esc(me.available_from)}" required></div>
      <div><label>Available until</label>
        <input type="date" name="available_to" value="${esc(me.available_to)}" required></div>
    </div>

    <label>Hours per week you can give</label>
    <input type="number" name="hours_per_week" min="0" max="80" value="${me.hours_per_week || 10}">

    <label>City</label>
    <input type="text" name="location" value="${esc(me.location)}" placeholder="Chennai">

    <label class="inline-check"><input type="checkbox" name="remote_ok" ${me.remote_ok ? 'checked' : ''}> Open to remote projects</label>
    <label class="inline-check"><input type="checkbox" name="willing_to_travel" ${me.willing_to_travel ? 'checked' : ''}> Willing to travel for in-person events</label>
    <label class="inline-check"><input type="checkbox" name="open_to_join" ${me.open_to_join ? 'checked' : ''}> Currently open to joining a team</label>

    <h2>Past projects</h2>
    <p class="sub">Scored on whether they resemble the work a team needs — the
      skills used and the domain. How far a project got and whether there's a
      link to open both count, so a shipped project with a repo outranks an
      identical-sounding prototype.</p>
    <div id="projects"></div>
    <button type="button" class="ghost" onclick="addProject()">+ Add another project</button>

    <h2>Links</h2>
    <label>GitHub</label>
    <input type="text" name="github" value="${esc(me.github)}" placeholder="https://github.com/…">
    <label>LinkedIn</label>
    <input type="text" name="linkedin" value="${esc(me.linkedin)}" placeholder="https://linkedin.com/in/…">

    <div class="actions" style="margin-top:24px">
      <button>Finish and see my matches</button>
    </div>`);

  (me.past_projects || []).forEach(addProject);
  if (!(me.past_projects || []).length) addProject();
})();
</script>
</body>
</html>
