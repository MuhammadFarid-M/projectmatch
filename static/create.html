<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post a requirement · ProjectMatch</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap narrow">
  <h1>Post a requirement</h1>
  <p class="sub">Add one role block per person you need. Must-haves are
    weighted double when candidates are scored.</p>
  <form method="POST" action="/posts" id="form"></form>
</div>

<script src="/app.js"></script>
<script>
let V = null, slotCount = 0;

function slotBlock(i) {
  return `
  <div class="slot-block">
    <label>Role ${i + 1}</label>
    <select name="role">
      ${V.roles.map(r => `<option>${esc(r)}</option>`).join('')}
    </select>

    <label>Minimum experience level</label>
    <select name="min_level">
      ${V.levels.map(l => `<option ${l === 'intermediate' ? 'selected' : ''}>${esc(l)}</option>`).join('')}
    </select>

    <label>Must-have skills — weighted double</label>
    ${picker('must_have_' + i, V.skills)}

    <label>Nice-to-have skills</label>
    ${picker('nice_to_have_' + i, V.skills)}
  </div>`;
}

function addSlot() {
  document.getElementById('slots')
    .insertAdjacentHTML('beforeend', slotBlock(slotCount++));
}

(async () => {
  const me = await injectNav();
  if (!me) { location.href = '/auth.html'; return; }
  V = await api('/api/vocab');

  document.getElementById('form').innerHTML = `
    <label>Title</label>
    <input type="text" name="title" required
      placeholder="Need a frontend dev for next week's hackathon">

    <label>Description</label>
    <textarea name="description"
      placeholder="What you're building, what's already handled, team size."></textarea>

    <div class="row">
      <div><label>Event type</label>
        <select name="event_type">${V.event_types.map(e => `<option>${esc(e)}</option>`).join('')}</select></div>
      <div><label>Hours per week needed</label>
        <input type="number" name="hours_needed" min="0" max="80" value="20"></div>
    </div>

    <label>Domains — used to match people who care about the same problems</label>
    ${picker('domains', V.domains)}

    <div class="row">
      <div><label>Starts on</label><input type="date" name="starts_on" required></div>
      <div><label>Ends on</label><input type="date" name="ends_on"></div>
    </div>

    <label>City</label>
    <input type="text" name="location" placeholder="Chennai">
    <label class="inline-check"><input type="checkbox" name="remote_ok"> Remote is fine</label>

    <h2>Roles you need</h2>
    <div id="slots"></div>
    <button type="button" class="ghost" onclick="addSlot()">+ Add another role</button>

    <div class="actions"><button>Publish and see matches</button></div>`;

  addSlot();
})();
</script>
</body>
</html>
