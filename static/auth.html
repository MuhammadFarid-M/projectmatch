<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · ProjectMatch</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap narrow">
  <div id="notice"></div>

  <h1>Sign in</h1>
  <form method="POST" action="/login">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <div class="actions"><button>Sign in</button></div>
  </form>

  <h2>New here?</h2>
  <form method="POST" action="/signup">
    <label>Name</label>
    <input type="text" name="name" required>
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <div class="actions"><button class="ghost">Create account</button></div>
  </form>

</div>

<script src="/app.js"></script>
<script>
const ERRORS = {
  bad: 'That email and password combination did not match.',
  exists: 'An account with that email already exists.',
  missing: 'Email and password are both required.'
};
(async () => {
  await injectNav();
  const e = qs('error');
  if (e) document.getElementById('notice').innerHTML =
    `<div class="notice bad">${esc(ERRORS[e] || 'Something went wrong.')}</div>`;
})();
</script>
</body>
</html>
