<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your profile · ProjectMatch</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap narrow">
  <h1>Your profile</h1>
  <p class="sub">This is what the matching engine scores. The more honest the
    availability and skills, the better your matches.</p>
  <div id="notice"></div>
  <form method="POST" action="/profile" id="form"></form>
</div>

<script src="/app.js"></script>
<script>
let V = null, projCount = 0;

function addProject(p) {
  const i = projCount++;
  document.getElementById('projects').insertAdjacentHTML('beforeend', `
    <div class="slot-block">
      <label>Project title</label>
      <input type="text" name="project_title"
        value="${esc(p?.title || '')}"
        placeholder="SOC alert triage dashboard">
      <div class="row">
        <div><label>How far did it get?</label>
          <select name="project_outcome">
            ${V.outcomes.map(o => `<option value="${esc(o)}" ${p?.outcome === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
          </select></div>
        <div><label>How long did it run?</label>
          <select name="project_duration">
            ${V.durations.map(d => `<option value="${esc(d)}" ${p?.duration === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}
          </select></div>
      </div>
      <label>Link to the repo or a live version</label>
      <input type="text" name="project_link" value="${esc(p?.link || '')}"
        placeholder="https://github.com/…">
      <label>Skills you used</label>
      ${picker('project_skills_' + i, V.skills, p?.skills || [])}
      <label>Domain it was in</label>
      ${picker('project_domains_' + i, V.domains, p?.domains || [])}
      <button type="button" class="linkish"
        onclick="this.closest('.slot-block').remove()">remove this project</button>
    </div>`);
}

(async () => {
  const me = await injectNav();
  if (!me) { location.href = '/auth.html'; return; }
  const v = await api('/api/vocab');
  V = v;

  if (qs('saved')) document.getElementById('notice').innerHTML =
    '<div class="notice good">Profile saved.</div>';
  if (qs('new')) document.getElementById('notice').innerHTML =
    '<div class="notice">Fill this in before browsing — matching needs your skills and dates.</div>';

  document.getElementById('form').innerHTML = `
    <label>Name</label>
    <input type="text" name="name" value="${esc(me.name)}" required>

    <label>Short description</label>
    <textarea name="bio" placeholder="A couple of lines about what you build and what you're looking for.">${esc(me.bio)}</textarea>

    <div class="row">
      <div>
        <label>Primary role</label>
        <select name="role">
          ${v.roles.map(r => `<option ${r === me.role ? 'selected' : ''}>${esc(r)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Experience level</label>
        <select name="experience_level">
          ${v.levels.map(l => `<option ${l === me.experience_level ? 'selected' : ''}>${esc(l)}</option>`).join('')}
        </select>
      </div>
    </div>

    <label>Skills</label>
    ${picker('skills', v.skills, me.skills)}

    <label>Interests — the domains you actually want to work in</label>
    ${picker('interests', v.domains, me.interests)}

    <div class="row">
      <div><label>Available from</label>
        <input type="date" name="available_from" value="${esc(me.available_from)}"></div>
      <div><label>Available until</label>
        <input type="date" name="available_to" value="${esc(me.available_to)}"></div>
    </div>

    <label>Hours per week available</label>
    <input type="number" name="hours_per_week" min="0" max="80" value="${me.hours_per_week || 0}">

    <h2>Past projects</h2>
    <p class="sub">Teams are scored on whether your previous work resembles
      what they need — the skills you used and the domain you worked in.
      How far it got and whether there's a link to open also count, so a
      shipped project with a repo outranks an identical-sounding prototype.</p>
    <div id="projects"></div>
    <button type="button" class="ghost" onclick="addProject()">+ Add a project</button>

    <label>City</label>
    <input type="text" name="location" value="${esc(me.location)}">

    <label class="inline-check"><input type="checkbox" name="remote_ok" ${me.remote_ok ? 'checked' : ''}> Open to remote projects</label>
    <label class="inline-check"><input type="checkbox" name="willing_to_travel" ${me.willing_to_travel ? 'checked' : ''}> Willing to travel for in-person events</label>
    <label class="inline-check"><input type="checkbox" name="open_to_join" ${me.open_to_join ? 'checked' : ''}> Currently open to joining a team</label>

    <label>GitHub URL</label>
    <input type="text" name="github" value="${esc(me.github)}" placeholder="https://github.com/…">

    <label>LinkedIn URL</label>
    <input type="text" name="linkedin" value="${esc(me.linkedin)}" placeholder="https://linkedin.com/in/…">

    <div class="actions"><button>Save profile</button></div>`;

  (me.past_projects || []).forEach(addProject);
  if (!(me.past_projects || []).length) addProject();
})();
</script>
</body>
</html>
