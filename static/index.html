<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectMatch</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div id="setup-notice"></div>

  <header class="hero">
      <h1 id="hero-headline">Find the people your team is <em>missing</em>.</h1>
      <p>Most teams get built out of whoever you already know. Post what the
        team still needs and everyone here gets ranked by how much of that gap
        they close &mdash; the skills, the free dates, the projects they have
        actually shipped.</p>
      <div class="hero-stats" id="hero-stats"></div>
      <div class="hero-cta" id="hero-cta"></div>
  </header>

  <div id="feed-section" style="display:none">
    <h2>Matched to you</h2>
    <div id="feed"></div>
  </div>

  <h2>Browse everything</h2>
  <div class="filters">
    <div>
      <label>Role needed</label>
      <select id="f-role"><option value="">Any role</option></select>
    </div>
    <div>
      <label>Event type</label>
      <select id="f-event"><option value="">Any type</option></select>
    </div>
    <div>
      <label>Domain</label>
      <select id="f-domain"><option value="">Any domain</option></select>
    </div>
    <div>
      <label>Starts after</label>
      <input type="date" id="f-date">
    </div>
  </div>
  <div id="browse"></div>
</div>

<script src="/pixelswap.js"></script>
<script src="/app.js"></script>
<script>
async function loadFeed() {
  if (!ME) return;
  const rows = await api('/api/feed');
  if (!rows.length) return;
  document.getElementById('feed-section').style.display = 'block';
  document.getElementById('feed').innerHTML = rows.slice(0, 5).map(postCard).join('');
}

async function loadBrowse() {
  const p = new URLSearchParams();
  const role = document.getElementById('f-role').value;
  const ev = document.getElementById('f-event').value;
  const dom = document.getElementById('f-domain').value;
  const date = document.getElementById('f-date').value;
  if (role) p.set('role', role);
  if (ev) p.set('event_type', ev);
  if (dom) p.set('domain', dom);
  if (date) p.set('starts_after', date);

  const posts = await api('/api/posts?' + p);
  document.getElementById('browse').innerHTML = posts.length
    ? posts.map(postCard).join('')
    : '<div class="empty">No open posts match those filters.</div>';
}

(async () => {
  await injectNav();

  const meData = await api('/api/me');
  if (meData.logged_in && !meData.profile_complete) {
    document.getElementById('setup-notice').innerHTML =
      `<div class="notice">Your profile is incomplete, so teams can't match you yet.
       <a href="/onboarding.html">Finish setting it up</a>.</div>`;
  }
  if (qs('welcome')) document.getElementById('setup-notice').innerHTML =
    '<div class="notice good">Profile saved — here is what you match.</div>';

  const v = await api('/api/vocab');
  const fill = (id, list) => {
    document.getElementById(id).insertAdjacentHTML('beforeend',
      list.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join(''));
  };
  fill('f-role', v.roles);
  fill('f-event', v.event_types);
  fill('f-domain', v.domains);

  ['f-role','f-event','f-domain','f-date'].forEach(id =>
    document.getElementById(id).addEventListener('change', loadBrowse));

  renderCta();
  startHeadline();
  await loadFeed();
  await loadBrowse();
  await loadStats();
})();

/* Two phrases making the same argument from opposite ends: what the product
   does, and what it replaces. The accent word carries the meaning — green
   for what you gain, amber for the limitation you are stuck with today. */
const HEADLINES = [
  { html: 'Find the people your team is <em>missing</em>.' },
  { html: 'Your next teammate isn\u2019t in your <em class="alt">contacts</em>.' }
];

function startHeadline() {
  const el = document.getElementById('hero-headline');
  if (!el || typeof PixelSwap === 'undefined') return;
  const swap = new PixelSwap(el, {
    pixelSize: 34,
    gap: 2,
    pixelScale: 0.28,
    duration: 900,
    pixelDuration: 380,
    pattern: 'diagonal',
    randomness: 0.55,
    interval: 2000        // time each phrase stays on screen
  });
  swap.start(HEADLINES);
}

function renderCta() {
  const el = document.getElementById('hero-cta');
  if (!el) return;
  el.innerHTML = ME
    ? ''
    : `<a class="btn" href="/auth.html">Create an account</a>`;
}

async function loadStats() {
  const posts = await api('/api/posts');
  const openRoles = posts.reduce(
    (n, p) => n + (p.slots || []).filter(s => !s.filled_by).length, 0);
  document.getElementById('hero-stats').innerHTML = `
    <span><b>${posts.length}</b> ${posts.length === 1 ? 'team' : 'teams'} building right now</span>
    <span><b>${openRoles}</b> ${openRoles === 1 ? 'role' : 'roles'} still open</span>`;
}
</script>
</body>
</html>
