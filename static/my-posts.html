<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My posts · ProjectMatch</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <h1>My posts</h1>
  <p class="sub">The teams you're building, who's on board, and who's waiting
    on you.</p>
  <div id="list"></div>
</div>

<script src="/app.js"></script>
<script>
const JOINED_VIA = {
  applied: 'applied',
  invited: 'you invited them',
  added: 'added'
};

function memberRow(s) {
  const m = s.member;
  return `
    <div class="roster-row">
      <div class="grow">
        <strong><a href="/user.html?id=${m.id}">${esc(m.name)}</a></strong>
        <span class="pill filled">${esc(s.role)}</span>
        <div class="meta">
          ${esc(m.experience_level || '')}${m.location ? ' · ' + esc(m.location) : ''}
          · ${esc(JOINED_VIA[s.joined_via] || s.joined_via)}
        </div>
        <div class="meta">
          <strong>${esc(m.email || '')}</strong>
          ${m.github ? ` · <a href="${esc(m.github)}" target="_blank" rel="noopener">GitHub</a>` : ''}
          ${m.linkedin ? ` · <a href="${esc(m.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ''}
        </div>
      </div>
    </div>`;
}

function openRow(s) {
  return `
    <div class="roster-row open">
      <div class="grow">
        <strong>${esc(s.role)}</strong>
        <span class="pill">still open</span>
        <div class="meta">
          ${(s.must_have || []).length ? 'needs ' + esc((s.must_have || []).join(', ')) : 'no must-haves set'}
        </div>
      </div>
    </div>`;
}

function postCardOwner(p) {
  const done = p.filled === p.total_slots && p.total_slots > 0;
  return `
  <div class="card">
    <div class="card-head">
      <div class="grow">
        <h3><a href="/post.html?id=${p.id}">${esc(p.title)}</a></h3>
        <div class="meta">
          ${esc(p.event_type || '')}
          ${p.starts_on ? ' · ' + esc(p.starts_on) : ''}
          ${p.location ? ' · ' + esc(p.location) : ''}
          ${p.remote_ok ? ' · remote ok' : ''}
        </div>
      </div>
      <span class="pill ${done ? 'filled' : ''}">${p.filled}/${p.total_slots} filled${p.status === 'closed' ? ' · closed' : ''}</span>
    </div>

    <div class="roster">
      ${p.slots.filter(s => s.member).map(memberRow).join('')}
      ${p.slots.filter(s => !s.member).map(openRow).join('')}
    </div>

    <div class="actions">
      <a class="btn ghost" href="/post.html?id=${p.id}">
        ${p.waiting_count
          ? `Review ${p.waiting_count} application${p.waiting_count > 1 ? 's' : ''}`
          : 'See ranked candidates'}
      </a>
      <a class="btn ghost" href="/edit-post.html?id=${p.id}">Edit</a>
      <form method="POST" action="/posts/${p.id}/status">
        <input type="hidden" name="status" value="${p.status === 'open' ? 'closed' : 'open'}">
        <button class="danger">${p.status === 'open' ? 'Close post' : 'Reopen'}</button>
      </form>
      ${p.invited_count
        ? `<span class="meta">${p.invited_count} invite${p.invited_count > 1 ? 's' : ''} awaiting a reply</span>`
        : ''}
    </div>
  </div>`;
}

(async () => {
  const me = await injectNav();
  if (!me) { location.href = '/auth.html'; return; }

  const posts = await api('/api/my-posts');
  document.getElementById('list').innerHTML = posts.length
    ? posts.map(postCardOwner).join('')
    : `<div class="empty">You haven't posted anything yet.
       <a href="/create.html">Post a requirement</a> and the platform will
       rank people for you straight away.</div>`;
})();
</script>
</body>
</html>
