<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · ProjectMatch</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap narrow">
  <div id="profile"><div class="empty">Loading…</div></div>
</div>

<script src="/app.js"></script>
<script>
const OUTCOME_LABEL = {
  prototype: 'prototype',
  completed: 'completed',
  shipped: 'shipped',
  award: 'placed in a competition'
};

function projectCard(p) {
  return `
  <div class="card proj-card">
    <h3>${esc(p.title)}</h3>
    <div class="proj-meta">
      ${p.outcome ? `<span class="pill outcome">${esc(OUTCOME_LABEL[p.outcome] || p.outcome)}</span>` : ''}
      ${p.duration ? `<span class="pill">${esc(p.duration)}</span>` : ''}
      ${p.link ? `<a class="pill" href="${esc(p.link)}" target="_blank" rel="noopener">see it</a>` : ''}
    </div>
    <div class="tags">
      ${(p.skills || []).map(s => `<span class="tag must">${esc(s)}</span>`).join('')}
      ${(p.domains || []).map(d => `<span class="tag">${esc(d)}</span>`).join('')}
    </div>
  </div>`;
}

(async () => {
  await injectNav();
  const id = qs('id');

  let u;
  try {
    u = await api('/api/users/' + id);
  } catch (e) {
    document.getElementById('profile').innerHTML =
      '<div class="empty">That profile could not be loaded.</div>';
    return;
  }
  if (!u || u.error) {
    document.getElementById('profile').innerHTML =
      '<div class="empty">No such profile.</div>';
    return;
  }

  const isMe = ME && ME.id === u.id;
  const bits = [u.role, u.experience_level, u.location].filter(Boolean);
  const projects = u.past_projects || [];

  document.getElementById('profile').innerHTML = `
    <div class="profile-head">
      <span class="avatar lg" aria-hidden="true">${esc((u.name || '?').trim()[0] || '?')}</span>
      <div class="grow">
        <h1 style="margin-bottom:2px">${esc(u.name)}</h1>
        <p class="sub" style="margin-bottom:6px">${esc(bits.join(' · '))}</p>
        <div class="meta">
          ${u.github ? `<a href="${esc(u.github)}" target="_blank" rel="noopener">GitHub</a>` : ''}
          ${u.linkedin ? `${u.github ? ' · ' : ''}<a href="${esc(u.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ''}
          ${u.email ? `${(u.github || u.linkedin) ? ' · ' : ''}<strong>${esc(u.email)}</strong>` : ''}
        </div>
      </div>
      ${isMe ? '<a class="btn ghost" href="/profile.html">Edit</a>' : ''}
    </div>

    ${u.bio ? `<div class="card"><p style="margin:0">${esc(u.bio)}</p></div>` : ''}

    <div class="card">
      <div class="meta">
        ${u.open_to_join
          ? '<strong>Open to joining a team</strong>'
          : '<strong>Not currently looking</strong>'}
        ${u.available_from ? ` · free ${esc(u.available_from)} → ${esc(u.available_to || '')}` : ''}
        ${u.hours_per_week ? ` · ${u.hours_per_week} hrs/week` : ''}
        ${u.remote_ok ? ' · remote ok' : ''}
        ${u.willing_to_travel ? ' · will travel' : ''}
      </div>
    </div>

    <h2>Skills</h2>
    <div class="tags">
      ${(u.skills || []).length
        ? (u.skills || []).map(s => `<span class="tag must">${esc(s)}</span>`).join('')
        : '<span class="meta">None listed yet.</span>'}
    </div>

    <h2>Interested in</h2>
    <div class="tags">
      ${(u.interests || []).length
        ? (u.interests || []).map(d => `<span class="tag">${esc(d)}</span>`).join('')
        : '<span class="meta">None listed yet.</span>'}
    </div>

    <h2>Past projects</h2>
    ${projects.length
      ? projects.map(projectCard).join('')
      : '<div class="empty">No projects listed yet.</div>'}`;
})();
</script>
</body>
</html>
